services:
  mongodb:
    image: cmrunite-mongodb:local
    build:
      context: .
      dockerfile: deploy/MongoRuntime.Dockerfile
    restart: unless-stopped
    volumes:
      - alumni_mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-service:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    build: ./ML-Service
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongodb:27017
      DB_NAME: alumniDB
      CORS_ORIGIN: http://backend:4000
    depends_on:
      mongodb:
        condition: service_healthy

  backend:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health', {signal: AbortSignal.timeout(3000)}).then(r=>r.json()).then(d=>process.exit(d.database==='connected' && d.mlService==='connected' ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    build: ./Backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/alumniDB
      ML_SERVICE_URL: http://ml-service:5001
      PUBLIC_API_URL: http://localhost:8080
      CORS_ORIGIN: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: 30m
      JWT_COOKIE_EXPIRES_IN: 30
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      PLACEMENT_JOB_EMAIL_ENABLED: ${PLACEMENT_JOB_EMAIL_ENABLED:-false}
      PLACEMENT_OFFICE_EMAIL: ${PLACEMENT_OFFICE_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    volumes:
      - alumni_uploads:/app/public/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  frontend:
    build: ./Frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  alumni_mongodb:
  alumni_uploads:
