name: Project quality gates

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev
      - name: Validate JavaScript syntax
        run: find . -path ./node_modules -prune -o -name '*.js' -exec node --check {} \;

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m venv ../ML-Service/.venv
      - run: ../ML-Service/.venv/bin/pip install -r ../ML-Service/requirements.txt
      - run: npm ci --prefix ../Backend
      - run: npm audit --omit=dev --audit-level=high
      - name: Run frontend and every live feature regression
        run: |
          for config in playwright.config.js playwright.rejection.config.js playwright.placement.config.js playwright.community.config.js playwright.directory.config.js playwright.super-admin.config.js playwright.full-project.config.js; do
            npx playwright test --config "$config" || exit 1
          done
      - name: Verify the server survives former crash probes
        working-directory: ./Backend
        run: |
          node tests/helpers/invalidMessageQAProbe.js
          QA_PROBE_MODE=repeat-message node tests/helpers/invalidMessageQAProbe.js

  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ML-Service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ML-Service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile app.py evaluate.py discovery_policy.py
      - run: pip install pip-audit && pip-audit -r requirements.txt

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config
        env:
          JWT_SECRET: ci-secret-value
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-admin-password
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
        working-directory: Frontend
      - run: npx playwright install --with-deps chromium
        working-directory: Frontend
      - name: Build and verify isolated containers
        env:
          JWT_SECRET: ci-isolated-container-secret
        run: |
          docker compose -p cmreunite-ci -f docker-compose.yml -f docker-compose.qa.yml up -d --build
          for attempt in $(seq 1 60); do
            if curl --fail http://localhost:18080/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:18080/health
          docker compose -p cmreunite-ci -f docker-compose.yml -f docker-compose.qa.yml exec -T frontend nginx -t
          docker compose -p cmreunite-ci -f docker-compose.yml -f docker-compose.qa.yml stop backend
          docker compose -p cmreunite-ci -f docker-compose.yml -f docker-compose.qa.yml run --rm --no-deps -T -v "$PWD/Backend/tests/helpers:/app/tests/helpers:ro" backend node tests/helpers/containerIndexQAProbe.js
          docker compose -p cmreunite-ci -f docker-compose.yml -f docker-compose.qa.yml start backend
          docker compose -p cmreunite-ci -f docker-compose.yml -f docker-compose.qa.yml run --rm --no-deps -T -e QA_CONTAINER_FIXTURES=true -v "$PWD/Backend/tests/helpers:/app/tests/helpers:ro" backend node tests/helpers/seedContainerQA.js
          (cd Frontend && npx playwright test --config playwright.containers.config.js)
      - name: Clean up disposable containers
        if: always()
        env:
          JWT_SECRET: ci-isolated-container-secret
        run: docker compose -p cmreunite-ci -f docker-compose.yml -f docker-compose.qa.yml down -v

  production-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm ci
        working-directory: Frontend
      - run: npx playwright install --with-deps chromium
        working-directory: Frontend
      - run: python scripts/test_monitor.py
      - name: Test HTTPS, security, migrations and encrypted recovery
        run: python scripts/test_production.py
      - name: Scan exported runtime images without Docker daemon access
        run: python scripts/scan_images.py --output image-audits
      - name: Scan source for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --config /repo/.gitleaks.toml --redact --no-banner
