geo $realip_remote_addr $trusted_edge { default 0; ${EDGE_SUBNET} 1; }
map "$trusted_edge:$http_x_forwarded_proto" $forwarded_scheme { default $scheme; "1:https" https; }
map "$request_method:$http_accept:$uri" $spa_document {
  default 0;
  ~^GET:.*text/html.*:/(register|super-admin|jobs|profile|announcements|recognition|connections|mentorship|notifications|messages|assistant|contributions)$ 1;
}

server {
  listen 8080;
  set_real_ip_from ${EDGE_SUBNET};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  client_max_body_size 12m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ^~ /internal/ { return 404; }

  location /socket.io/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header Host $http_host;
  }

  location ~ ^/(departments|super-admin|posts|auth|register|otp|profile|alumni|admin|event|jobs|bulk|announcements|uploads|recognition|connections|mentorship|referrals|community|contributions|ml|notifications|messages|assistant|network|health|api-docs)(/|$) {
    if ($spa_document) { rewrite ^ /index.html last; }
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
