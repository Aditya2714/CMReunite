server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /socket.io/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location ~ ^/(auth|register|otp|profile|alumni|admin|event|jobs|bulk|announcements|uploads|recognition|connections|mentorship|referrals|community|contributions|ml|notifications|messages|assistant|network|health|api-docs)(/|$) {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
