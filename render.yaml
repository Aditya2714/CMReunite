envVarGroups:
  - name: cmrunite-service-secrets
    envVars:
      - key: ML_SERVICE_TOKEN
        generateValue: true

services:
  - type: web
    name: cmrunite-aditya2714
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm --prefix Backend ci --omit=dev && npm --prefix Frontend ci --include=dev && npm --prefix Frontend run build && cp -R Frontend/dist/. Backend/public/
    startCommand: node Backend/server.js
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - fromGroup: cmrunite-service-secrets
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: APP_VERSION
        value: render-demo
      - key: LOCAL_PRODUCTION_QA
        value: "false"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: cmrunite-aditya2714
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_API_URL
        fromService:
          type: web
          name: cmrunite-aditya2714
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: cmrunite-aditya2714
          envVarKey: RENDER_EXTERNAL_URL
      - key: MONGODB_URI
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: cmrunite-ml-aditya2714
          envVarKey: RENDER_EXTERNAL_URL
      - key: TRUST_PROXY
        value: loopback,linklocal,uniquelocal
      - key: JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: MONITOR_TOKEN
        generateValue: true
      - key: PLACEMENT_JOB_EMAIL_ENABLED
        value: "false"
      - key: SMTP_REQUIRE_TLS
        value: "true"

  - type: web
    name: cmrunite-ml-aditya2714
    runtime: python
    plan: free
    region: singapore
    rootDir: ML-Service
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 60 app:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - fromGroup: cmrunite-service-secrets
      - key: MONGO_URI
        fromService:
          type: web
          name: cmrunite-aditya2714
          envVarKey: MONGODB_URI
      - key: DB_NAME
        value: alumniDB
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: cmrunite-aditya2714
          envVarKey: RENDER_EXTERNAL_URL
